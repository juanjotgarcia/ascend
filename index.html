<html lang="en">
<head>

  <title>Ledger</title>
  <meta name="description" content="Calisthenics and gym training, nutrition, habits and faith — leveled up.">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="manifest" href="manifest.webmanifest">

<body>
  <div class="bg" aria-hidden="true"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i><i class="blob b4"></i></div>

    <nav id="nav" class="glass" aria-label="Main"></nav>
    <main id="view"></main>
    <button id="fab" data-act="coach" aria-label="Open Coach Caleb">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/><path d="M9 10h6"/></svg>

  <div id="banners" aria-live="polite"></div>
  <div id="toasts" aria-live="polite"></div>

  <script src="js/data.js"></script>

  <script src="js/ranks.js"></script>

  <script src="js/notify.js"></script>
